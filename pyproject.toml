[project]
name = "socialize"
version = "0.1.0"
description = "Personal social media agents orchestration platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "itsdangerous>=2.2",
    "bcrypt>=4.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "litellm>=1.52",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0",
    "apscheduler>=3.10",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.149",
    "cryptography>=43.0",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8.1",
    "httpx>=0.27",
    "html2text>=2024.2",
    "pillow>=10.4",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
